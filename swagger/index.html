  <script>
    window.onload = () => {
      let specObj;
      try {
        const specEl = document.getElementById('openapi-spec-data');
        if (specEl) specObj = JSON.parse(specEl.textContent);
      } catch (e) {
        console.warn('Could not parse inline OpenAPI spec:', e);
      }

      const isGhPages = window.location.hostname.includes('github.io');
      let specUrl = '/api/openapi.json';
      if (isGhPages) {
        const segments = window.location.pathname.split('/').filter(Boolean);
        if (segments.length > 1 && segments[0] !== 'swagger' && segments[0] !== 'docs') {
          specUrl = '/' + segments[0] + '/api/openapi.json';
        }
      }

      const config = {
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        showRequestHeaders: true
      };

      if (specObj) {
        config.spec = specObj;
      } else {
        config.url = specUrl;
      }

      window.ui = SwaggerUIBundle(config);
    };
  </script>
